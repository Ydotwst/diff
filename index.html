<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextDiff｜テキスト差分チェッカー</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Text<span>Diff</span></h1>
  <div class="controls">
    <div class="theme-switcher">
      <button class="theme-btn" id="btn-light" data-theme="light">☀ Light</button>
      <button class="theme-btn" id="btn-dark"  data-theme="dark"><svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark</button>
    </div>
    <button class="btn" id="btn-swap" title="左右を入れ替え">⇄ 入れ替え</button>
    <button class="btn" id="btn-clear" title="すべてクリア">クリア</button>
    <button class="btn primary" id="btn-diff">比較する</button>
  </div>
</header>

<main>
  <div class="input-area">
    <div>
      <div class="pane-label">変更前 (オリジナル)</div>
      <textarea id="text-a" placeholder="オリジナルのテキストを入力...&#10;&#10;例: Hello, World!
This is a sample text.
It has multiple lines."></textarea>
    </div>
    <div>
      <div class="pane-label">変更後 (修正版)</div>
      <textarea id="text-b" placeholder="比較するテキストを入力...&#10;&#10;例: Hello, World!
This is a great sample text.
It has several lines.
And a new line!"></textarea>
    </div>
  </div>

  <div class="output-area" id="output">
    <div class="placeholder">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
      </svg>
      <span>テキストを入力して「比較する」を押してください</span>
    </div>
  </div>
  <div id="char-stats" class="char-stats"></div>
</main>

<footer>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch diff"></div>差分箇所</div>
  </div>
  <span class="footer-copy">&copy; 2026 Y (dot) WORKSTUDIO</span>
  <span style="margin-left:auto">TextDiff &mdash; ブラウザのみで動作、サーバー送信なし</span>
</footer>

<script src="diff.js"></script>
</body>
</html>
